<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email updates — DesignPraise Eric</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0820">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dp-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
@font-face{font-family:"DesignPraise Sans";src:url(/fonts/DesignPraiseSans.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Google Sans Code";src:url(/fonts/GoogleSansCode.woff2) format("woff2");font-weight:300 800;font-display:swap}
:root{--out:cubic-bezier(.16,1,.3,1);--sig:cubic-bezier(.7,0,.2,1);--sans:"DesignPraise Sans","Segoe UI",system-ui,sans-serif;--mono:"Google Sans Code",ui-monospace,Menlo,monospace;--violet:#6403ee}
:root[data-theme=light]{color-scheme:light;--bg:#f7f5fc;--card:#fff;--ink:#1a0d3e;--mute:#5a5278;--line:#e8e3f3;--tint:#f1ebff;--accent:#6403ee}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e0820;--card:#1c1140;--ink:#f4f0ff;--mute:#b4a9dc;--line:#2c1f5c;--tint:#2a1a66;--accent:#a57bff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
:root[data-theme=dark] body{background:radial-gradient(55% 70% at 85% 0%,rgba(3,238,216,.08),transparent 60%),radial-gradient(55% 70% at 5% 35%,rgba(217,3,238,.10),transparent 60%),var(--bg)}
header,footer{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,56px);font:500 12px var(--mono);color:var(--mute)}
header a{color:var(--mute);text-decoration:none}
main{display:grid;place-items:center;padding:24px clamp(20px,5vw,56px) 56px}
.card{width:min(520px,100%);background:var(--card);border-radius:20px;padding:clamp(28px,5vw,44px);box-shadow:0 0 0 1px var(--line),0 30px 80px -40px rgba(26,13,62,.5);
  transform-origin:50% 100%;animation:turn .6s var(--sig) both}
@keyframes turn{from{transform:perspective(900px) rotateX(-90deg);opacity:0}}
.gem{width:14px;height:14px;border-radius:4px;background:var(--accent);transform:rotate(45deg);margin-bottom:22px;animation:spin 1.1s .3s var(--sig) both}
@keyframes spin{from{transform:rotate(-45deg) scale(.3)}}
h1{margin:0;font-size:clamp(26px,4vw,34px);line-height:1.15;letter-spacing:-.025em}
p{margin:12px 0 0;color:var(--mute)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:12px;border:0;font:600 15px var(--sans);text-decoration:none;cursor:pointer;background:var(--violet);color:#fff}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){.card,.gem{animation:none}}
</style>
</head>
<body>
<header><a href="/">designpraise eric</a><span>email updates</span></header>
<main><div class="card" id="card"><div class="gem"></div><h1 id="h">One moment…</h1><p id="p"></p><div class="btns" id="b"></div></div></main>
<footer><span>DesignPraise Studio, Lagos</span><span>designpraiseeric</span></footer>
<script>
(function(){
  var q=new URLSearchParams(location.search),c=q.get("c"),u=q.get("u"),
      H=document.getElementById("h"),P=document.getElementById("p"),B=document.getElementById("b");
  // Keep the token out of the address bar and history once read.
  if(c||u)history.replaceState(null,"",location.pathname);
  function show(h,p,btns){H.textContent=h;P.textContent=p||"";B.innerHTML="";(btns||[]).forEach(function(x){B.appendChild(x)})}
  function link(t,href,line){var a=document.createElement("a");a.className="btn"+(line?" line":"");a.href=href;a.textContent=t;return a}
  function post(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong.");return j})})}
  var home=link("Visit the site","/",false),tools=link("After Effects tools","/tools/",true);
  if(c){
    post("/api/confirm",{t:c}).then(function(){show("You’re subscribed.","Thank you. You’ll hear from me when there’s new work, a new tool, or something worth your time.",[home,tools])})
      .catch(function(e){show("That link didn’t work.",e.message+" You can sign up again from the site.",[home])});
  }else if(u){
    var go=document.createElement("button");go.className="btn";go.textContent="Unsubscribe";
    var stay=link("Keep me subscribed","/",true);
    go.onclick=function(){go.disabled=true;go.textContent="Unsubscribing…";
      post("/api/unsubscribe",{t:u}).then(function(){show("You’re unsubscribed.","You won’t get any more updates. If you change your mind, you can sign up again on the site.",[home])})
        .catch(function(e){show("That link didn’t work.",e.message,[home])})};
    show("Unsubscribe from updates?","You’ll stop getting all emails from DesignPraise Eric.",[go,stay]);
  }else{
    show("Email updates","New work, new tools and updates to the ones you use. Sign up at the bottom of the home page.",[link("Sign up","/#updates",false)]);
  }
})();
</script>
<script src="/js/dp-gate.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DesignPraise Eric — Coming soon</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0820">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dp-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
@font-face{font-family:"DesignPraise Sans";src:url(/fonts/DesignPraiseSans.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Google Sans Code";src:url(/fonts/GoogleSansCode.woff2) format("woff2");font-weight:300 800;font-display:swap}
:root{--out:cubic-bezier(.16,1,.3,1);--sig:cubic-bezier(.7,0,.2,1);--sans:"DesignPraise Sans","Segoe UI",system-ui,sans-serif;--mono:"Google Sans Code",ui-monospace,Menlo,monospace;
--violet:#6403ee;--lilac:#a57bff;--amber:#ffa800;--aqua:#03eed8;--magenta:#d903ee}
:root[data-theme=light]{color-scheme:light;--bg:#f7f5fc;--card:#fff;--ink:#1a0d3e;--mute:#5a5278;--line:#e8e3f3;--mark:#6403ee;--tint:#f1ebff;--tile:#ece4fe;--tile2:#ffffff}
:root[data-theme=dark]{color-scheme:dark;--bg:#0e0820;--card:#1c1140;--ink:#f4f0ff;--mute:#b4a9dc;--line:#2c1f5c;--mark:#a57bff;--tint:#2a1a66;--tile:#1c1140;--tile2:#150c30}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;overflow-x:hidden;transition:background .6s var(--out),color .6s var(--out)}
:root[data-theme=dark] body{background:radial-gradient(55% 70% at 85% 0%,rgba(3,238,216,.08),transparent 60%),radial-gradient(55% 70% at 5% 35%,rgba(217,3,238,.10),transparent 60%),var(--bg)}
header,footer{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,5vw,56px)}
.tag{font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--mute);text-transform:lowercase}
.theme{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .24s}
.theme:hover{background:var(--tint)}
.theme svg{width:20px;height:20px;transition:transform .6s var(--sig)}
:root[data-theme=dark] .theme svg{transform:rotate(180deg)}
main{display:grid;place-items:center;padding:24px clamp(20px,5vw,56px) 40px}
.stage{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:38px;max-width:760px;width:100%;text-align:center}

/* the cube: a 3x3 of tiles that turn like a puzzle cube */
.cube{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(168px,40vw);aspect-ratio:1;perspective:600px;position:relative}
.tile{position:relative;transform-style:preserve-3d;animation:turn 9s var(--sig) infinite;animation-delay:calc(var(--i)*.09s + 2.6s)}
.tile b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;background:var(--tile);border:1px solid var(--line)}
.tile b+b{transform:rotateY(180deg);background:var(--mark);border-color:transparent}
.tile:nth-child(3) b+b{background:var(--amber)}.tile:nth-child(7) b+b{background:var(--aqua)}.tile:nth-child(5) b+b{background:var(--magenta)}
@keyframes turn{0%,18%{transform:rotateY(0)}26%,62%{transform:rotateY(180deg)}70%,100%{transform:rotateY(360deg)}}
.mark{position:absolute;inset:16%;color:var(--ink);pointer-events:none}
.mark svg{width:100%;height:100%;overflow:visible}
.draw{fill:currentColor;fill-opacity:0;stroke:currentColor;stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s var(--out) .2s forwards,fill .8s var(--out) 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1;stroke-width:0}}
.cube.flip .mark{color:var(--bg);transition:color .5s var(--out)}

.wordmark{width:min(380px,78vw);color:var(--ink);clip-path:inset(0 100% 0 0);animation:unfurl 1.4s var(--sig) 1.9s forwards}
.wordmark svg{width:100%;height:auto;display:block}
.wordmark .mute{fill:var(--mute)}
@keyframes unfurl{to{clip-path:inset(0 0 0 0)}}

h1{font-size:clamp(28px,4.6vw,44px);line-height:1.12;letter-spacing:-.02em;font-weight:650;margin:0}
p.lead{color:var(--mute);font-size:clamp(15px,1.8vw,17px);max-width:46ch;margin:14px auto 0}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s var(--out) forwards}
.d1{animation-delay:2.7s}.d2{animation-delay:2.85s}.d3{animation-delay:3s}
@keyframes rise{to{opacity:1;transform:none}}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;transition:transform .3s var(--out),box-shadow .3s var(--out),background .3s var(--out)}
.btn.solid{background:var(--violet);color:#fff}
:root[data-theme=dark] .btn.solid{box-shadow:0 0 0 1px rgba(165,123,255,.35)}
.btn.solid:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px rgba(140,80,255,.7)}
.btn.line{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{background:var(--tint);transform:translateY(-2px)}
footer{font:12px var(--mono);color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.tile{animation:none}}
</style>
